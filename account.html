<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone | حساب کاربری</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">🎮 Game<span>Zone</span></a>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="shop.html">فروشگاه</a></li>
                <li><a href="compare.html">مقایسه تجهیزات</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn">🌓</button>
                <a href="wishlist.html" class="icon-btn">❤️ <span id="wishlist-badge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn">🛒 <span id="cart-badge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
        <h2>👤 حساب کاربری (دمو)</h2>
        <div class="glass-panel" style="padding: 2rem; margin-top: 1.5rem;">
            <div
                style="display: flex; align-items: center; gap: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
                <div
                    style="width: 70px; height: 70px; border-radius: 50%; background: var(--accent-neon); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #000; font-weight: bold;">
                    G</div>
                <div>
                    <h3>کاربر دمو GameZone</h3>
                    <p style="color: var(--text-muted);">demo@gamezone.test</p>
                </div>
            </div>
            <h3>📦 آخرین سفارش‌ها</h3>
            <div class="glass-panel" style="padding: 1rem; margin-top: 1rem; background: var(--bg-primary);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>سفارش #GZ-8942</span>
                    <span style="color: var(--accent-neon);">تحویل شده</span>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-muted);">تاریخ: ۱۴۰۳/۰۶/۱۲ | مبلغ کل: ۳۲,۵۰۰,۰۰۰ تومان
                </p>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
